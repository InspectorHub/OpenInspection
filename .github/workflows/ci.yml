name: CI

# Quality gate for pull requests. `verify` (at the bottom) is the authoritative
# merge gate — wire it as a required status check in branch protection.
#
# `verify` used to BE the work: one job running type-check, then test:types,
# then lint, then three test suites, then build, in a single 17.8-minute line.
# Nothing in that chain needed the step before it. It is now a fan-out, and
# `verify` is an aggregator that fails if any of them did.
#
# Keeping the NAME is the point of the aggregator. Branch protection requires a
# check called `verify`; splitting the work into differently-named jobs without
# it would leave the required check permanently absent, and a rule that never
# runs is worse than a slow one.
#
# Measured on the 2026-07-29 run, serial:
#     type-check 337s · lint 208s · test:unit 164s · test:types 126s
#     test:web 114s · install 39s · build 34s · test:workers 30s   = 17.8 min
# The fan-out's wall clock is setup + the slowest single job, ~4.5 min.
#
# Deliberately NOT a shared "setup" job that installs once and passes
# node_modules along: that reintroduces a serial stage, and every job here would
# still have to wait for it. Running `npm ci` concurrently costs ~39s of wall
# clock TOTAL because the jobs overlap. It does roughly double billed
# runner-minutes, which is the real trade being made.
#
# Note for anyone copying this locally: test:unit and test:web must NOT be run
# concurrently on ONE machine — concurrent runs under-collect spec files and
# emit phantom failures. Separate CI jobs are separate runners, so this is safe
# here and is not a licence to background them side by side in a terminal.
#
# This workflow runs ONLY on pull_request, not on push-to-main. Re-running the
# full suite on the merge commit is redundant: branch protection requires
# "branches up to date before merging" (strict), so a PR's tested tree equals
# the post-squash main tree. Default-branch security scanning still runs via
# codeql.yml (push + PR + schedule); release automation runs via
# release-please.yml (push).
on:
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Type checking ────────────────────────────────────────────────────────
  # Split app/api because they are two independent tsc programs; together they
  # were the longest step in the old chain. The app side needs the generators
  # first (paraglide messages + route types); the api side includes only
  # server/** and has never needed either.
  typecheck-app:
    name: type-check (app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      # server/generated/version.ts is git-ignored and produced by the build;
      # type-check imports it, so stamp it on a fresh checkout.
      - run: npm run gen-version
      # Keyed on the compiler's INPUTS, so a hit can only ever restore output
      # that those exact inputs produced — unlike a build-info cache, there is no
      # staleness to reason about. The stamp inside app/paraglide comes back with
      # it, so the script below sees "unchanged" and skips a ~66s compile.
      - uses: actions/cache@v4
        with:
          path: app/paraglide
          key: paraglide-${{ hashFiles('messages/**', 'project.inlang/**') }}
      - run: npm run i18n:compile:cached
      # Same shape as the paraglide cache above, and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run type-check:app

  typecheck-api:
    name: type-check (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      - run: npm run type-check:api

  # Type-only test project: expectTypeOf(...) assertions in tests/**/*.spec-d.ts
  # are a runtime no-op under plain vitest run — this is the only thing that
  # actually type-checks them.
  test-types:
    name: type-only tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      # Keyed on the compiler's INPUTS, so a hit can only ever restore output
      # that those exact inputs produced — unlike a build-info cache, there is no
      # staleness to reason about. The stamp inside app/paraglide comes back with
      # it, so the script below sees "unchanged" and skips a ~66s compile.
      - uses: actions/cache@v4
        with:
          path: app/paraglide
          key: paraglide-${{ hashFiles('messages/**', 'project.inlang/**') }}
      - run: npm run i18n:compile:cached
      # Same shape as the paraglide cache above, and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run test:types

  # ── Lint ─────────────────────────────────────────────────────────────────
  # eslint is type-aware here (unlike pre-commit, which sets ESLINT_FAST and
  # drops the type-information program) and is by far the slower half, so it
  # runs apart from the sixteen lint:* gates rather than in front of them.
  lint-eslint:
    name: lint (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      # Keyed on the compiler's INPUTS, so a hit can only ever restore output
      # that those exact inputs produced — unlike a build-info cache, there is no
      # staleness to reason about. The stamp inside app/paraglide comes back with
      # it, so the script below sees "unchanged" and skips a ~66s compile.
      - uses: actions/cache@v4
        with:
          path: app/paraglide
          key: paraglide-${{ hashFiles('messages/**', 'project.inlang/**') }}
      - run: npm run i18n:compile:cached
      # Same shape as the paraglide cache above, and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      # ESLint's own cache, persisted between runs. Measured on this repo: a cold
      # eslint is 442s, and a warm one with a single file touched is 6s — the
      # type-aware program is built lazily for the files actually linted, so a
      # cache hit skips that too. CI was paying the cold price every run.
      #
      # The classic reason this does not work on GitHub Actions is that a fresh
      # checkout gives every file a new mtime, and ESLint's DEFAULT cache
      # strategy is metadata — so the cache misses on all files. `lint:eslint`
      # already passes `--cache-strategy content`, which hashes contents instead;
      # that flag is what makes persisting this worthwhile at all. Do not remove
      # it without removing this cache.
      #
      # Keyed on the config and the lockfile, so a rule change or a plugin bump
      # starts a fresh cache rather than silently reusing verdicts computed under
      # the old rules. The restore-keys prefix CONTAINS that same hash, so a
      # fallback can only ever come from a run with identical rules — it cannot
      # under-invalidate. The commit sha suffix keeps a fresh copy saved each run
      # instead of freezing at the first one.
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
      - run: npm run lint:eslint

  lint-gates:
    name: lint (gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      # Keyed on the compiler's INPUTS, so a hit can only ever restore output
      # that those exact inputs produced — unlike a build-info cache, there is no
      # staleness to reason about. The stamp inside app/paraglide comes back with
      # it, so the script below sees "unchanged" and skips a ~66s compile.
      - uses: actions/cache@v4
        with:
          path: app/paraglide
          key: paraglide-${{ hashFiles('messages/**', 'project.inlang/**') }}
      - run: npm run i18n:compile:cached
      # knip resolves every `./+types/*` import a route file makes, so it needs
      # the generated route types present or it reports the whole of app/routes
      # as unresolved. In the old serial job these existed only because
      # type-check had already run; nothing declared the dependency.
      # Same shape as the paraglide cache above, and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run lint:gates-full
      - name: Migration drift gate (schema vs migrations)
        run: npm run db:check

  # ── Tests ────────────────────────────────────────────────────────────────
  # Sharded across four runners. This job was the longest in the workflow at
  # 7m22s, and the suite is import-bound rather than assertion-bound: `import`
  # dominates `tests` because 723 spec files each rebuild the module graph in
  # their own process.
  #
  # Sharding buys the wall-clock back WITHOUT touching a single test. Each shard
  # is an ordinary, fully isolated run of a subset — no shared state, no new
  # failure mode. Measured locally: shard 1/4 is 181 files / 1448 tests in 148s
  # against 422s for the whole suite.
  #
  # ⚠️ The other way to attack the same term — relaxing vitest's per-file process
  # isolation — was investigated and REJECTED, not merely skipped. 348 specs mock
  # `drizzle-orm/d1` at module scope and share one `vi.fn()` once the registry is
  # shared; vitest offers no per-file isolation override. See
  # docs/superpowers/plans/2026-08-08-test-isolation-debt.md (superproject).
  #
  # `fail-fast: false` so one red shard does not hide the others' results.
  test-unit:
    name: API unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/4

  test-workers:
    name: worker-runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      - run: npm run test:workers

  test-web:
    name: web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      # Keyed on the compiler's INPUTS, so a hit can only ever restore output
      # that those exact inputs produced — unlike a build-info cache, there is no
      # staleness to reason about. The stamp inside app/paraglide comes back with
      # it, so the script below sees "unchanged" and skips a ~66s compile.
      - uses: actions/cache@v4
        with:
          path: app/paraglide
          key: paraglide-${{ hashFiles('messages/**', 'project.inlang/**') }}
      - run: npm run i18n:compile:cached
      # Same shape as the paraglide cache above, and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run test:web

  # ── Build + bundle ceiling ───────────────────────────────────────────────
  build:
    name: build + bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci
      - run: npm run gen-version
      - run: npm run build
      # Bundle-size gate (Workers Free 3 MiB gzipped). Reuses the build/ output
      # from the previous step (--skip-build); also enforced in pre-commit.
      - run: npm run check:bundle -- --skip-build

  # ── The required check ───────────────────────────────────────────────────
  # Does no work; exists so branch protection has a single stable name to
  # require. `if: always()` plus the explicit result test is load-bearing: with
  # the default `success()` behaviour a SKIPPED dependency would let this pass,
  # so a cancelled or skipped job would read as green.
  verify:
    name: verify
    runs-on: ubuntu-latest
    if: always()
    needs:
      - typecheck-app
      - typecheck-api
      - test-types
      - lint-eslint
      - lint-gates
      - test-unit
      - test-workers
      - test-web
      - build
      # e2e was NOT in this list, so a red E2E run left `verify` green. Since
      # verify is the job branch protection keys off, that made the whole E2E
      # suite advisory without anyone deciding it should be — a gate that runs,
      # reports, and cannot block. It costs verify the wait for e2e (~5 min,
      # and it is the longest job), which is the price of it meaning what its
      # name says.
      - e2e
    steps:
      # Block scalar, not a plain one: a plain YAML scalar may not contain
      # ": " and `echo "results: …"` does, which is a parse error rather than
      # the harmless-looking line it resembles.
      - name: Report results
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
      # An EXPRESSION, not shell. GitHub expressions accept only single-quoted
      # strings; a stray double quote fails the entire WORKFLOW to parse, and
      # the run then shows zero jobs and "this run likely failed because of a
      # workflow file issue" — which looks nothing like a syntax error. Local
      # `yaml.safe_load` does not catch it either: that validates YAML, not
      # Actions expressions. This is how the first version of this file broke.
      - name: Fail if any check did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more checks did not succeed."
          exit 1

  # Seeded Playwright E2E against the real built worker. Independent of the
  # fan-out above. playwright.config.ts's `webServer` builds the worker and boots
  # `wrangler dev` on :8789; `globalSetup` truncates + migrates + seeds local D1
  # so every spec exercises the actual database. Auth is standalone-mode only
  # (the local login form) — saas login is a portal handoff and is out of scope
  # for this repo's CI.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build (via webServer) imports server/generated/version.ts.
      - name: Generate version stamp
        run: npm run gen-version

      # Provision a throwaway .dev.vars (ES256 keypair + JWT_SECRET + SETUP_CODE)
      # that `wrangler dev` reads at boot. Without it the worker has no JWT keys
      # and /api/auth/setup fails. Idempotent; all values freshly generated.
      - name: Provision ephemeral E2E secrets
        run: node scripts/gen-e2e-dev-vars.mjs

      # Keyed on the resolved Playwright version, because the browser build a
      # given Playwright pins is a pure function of it — a hit can only ever
      # restore the binary that version asked for. `--with-deps` still runs on a
      # hit; it installs system libraries into /usr, which is outside the cached
      # path and cheap once the download is skipped.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, seeded D1)
        run: npm run test:e2e

      # Second run, second config: the multi-user seed writes users into the
      # standalone tenant, which 409s the first run's fresh-setup assertion, so
      # the two cannot share one D1. Same worker (reuseExistingServer), so this
      # is one extra globalSetup, not one extra boot. See
      # playwright.seeded.config.ts for the full reasoning.
      - name: E2E tests (multi-user seed — subsystem D/E)
        run: npm run test:e2e:seeded

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
