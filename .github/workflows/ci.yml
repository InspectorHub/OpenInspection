name: CI

# Quality gate for pull requests. `verify` (at the bottom) is the authoritative
# merge gate — wire it as a required status check in branch protection.
#
# `verify` used to BE the work: one job running type-check, then test:types,
# then lint, then three test suites, then build, in a single 17.8-minute line.
# Nothing in that chain needed the step before it. It is now a fan-out, and
# `verify` is an aggregator that fails if any of them did.
#
# Keeping the NAME is the point of the aggregator. Branch protection requires a
# check called `verify`; splitting the work into differently-named jobs without
# it would leave the required check permanently absent, and a rule that never
# runs is worse than a slow one.
#
# Measured on the 2026-07-29 run, serial:
#     type-check 337s · lint 208s · test:unit 164s · test:types 126s
#     test:web 114s · install 39s · build 34s · test:workers 30s   = 17.8 min
# The fan-out's wall clock is setup + the slowest single job, ~4.5 min.
#
# Deliberately NOT a shared "setup" job that installs once and passes
# node_modules along: that reintroduces a serial stage, and every job here would
# still have to wait for it. Running `npm ci` concurrently costs ~39s of wall
# clock TOTAL because the jobs overlap. It does roughly double billed
# runner-minutes, which is the real trade being made.
#
# Note for anyone copying this locally: test:unit and test:web must NOT be run
# concurrently on ONE machine — concurrent runs under-collect spec files and
# emit phantom failures. Separate CI jobs are separate runners, so this is safe
# here and is not a licence to background them side by side in a terminal.
#
# This workflow runs on pull_request, and on demand. Re-running the full suite
# on every merge commit is redundant: branch protection requires "branches up
# to date before merging" (strict), so a PR's tested tree equals the resulting
# main tree. Default-branch security scanning still runs via codeql.yml
# (push + PR + schedule); release automation runs via release-please.yml (push).
#
# `workflow_dispatch` exists because that equality has one hole, and it is not
# hypothetical: a FORCE-PUSH to main never passes through a pull request, so
# nothing runs `verify` on what landed — and `verify` is the only required
# status check this branch has. A history rewrite on 2026-08-23 put 27 commits
# onto main that way. Without a manual trigger the only way to check them after
# the fact is to open a throwaway PR, which means adding a commit to main in
# order to test main.
on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Type checking ────────────────────────────────────────────────────────
  # ONE job, not two. This was split when app and api were two independent tsc
  # programs and together formed the longest step in the old chain. They are no
  # longer independent: tsconfig.api.json is a composite project that
  # tsconfig.json references, so `type-check:app` builds api first and reports
  # its errors. A second job was re-compiling the same project for the same
  # answer — see the note below where it used to be.
  typecheck-app:
    name: type-check (app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      # Restore the generated i18n output BEFORE install: `npm ci` runs `prepare`, which
      # compiles it (via the stamped script), so a hit turns that into a skip.
      - uses: ./.github/actions/i18n-cache
      - run: npm ci --prefer-offline --no-audit --no-fund
      # server/generated/version.ts is git-ignored and produced by the build;
      # type-check imports it, so stamp it on a fresh checkout.
      - run: npm run gen-version
      - run: npm run i18n:compile:cached
      # Same shape as the i18n cache (.github/actions/i18n-cache), and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run type-check:app
      # Also HERE rather than in its own job, and for the same arithmetic as
      # `test:types` below. `tsconfig.tests.json` is the program for
      # `tests/unit/**` + `tests/workers/**` — 785 files that no tsc program
      # compiled at all before it existed. It REFERENCES the api project rather
      # than joining it, so the `tsc -b` on the line above has already built
      # everything it consumes: what is left is one up-to-date check plus the
      # specs themselves.
      #
      # ⚠️ Do NOT move this into `tsconfig.api.json`'s include instead. That
      # project is composite and is a reference of the app program, so
      # `type-check:app` would build those 785 files FIRST — every pure-frontend
      # commit would pay for the spec tree, and so would this job's first step.
      - run: npm run type-check:tests
      # Runs HERE rather than in its own job. `test:types` only checks four
      # `*.spec-d.ts` files, but its tsconfig references the api project, and
      # `tsc -b` has already built that one line above — so this costs ~6s
      # instead of the ~4m36s a fresh runner spent rebuilding the same program.
      - run: npm run test:types

  # There is deliberately NO separate `type-check (api)` job. Since the two
  # programs became TypeScript project references, `type-check:app` IS
  # `tsc -b tsconfig.json`, which builds tsconfig.api.json first and reports its
  # errors — so a second job re-compiled the same project for the same answer.
  #
  # Verified rather than reasoned: a type error planted in `server/api/admin.ts`,
  # a file the app program does not import, is reported by `type-check:app` as
  # `server/api/admin.ts(53,7): error TS2322` with exit 2.
  #
  # `npm run type-check:api` still exists and is still the right local loop for
  # server-only work — pre-commit's api tier uses it. What was removed is the
  # duplicate CI runner, not the check.

  # ── Lint ─────────────────────────────────────────────────────────────────
  # eslint is type-aware here (unlike pre-commit, which sets ESLINT_FAST and
  # drops the type-information program) and is by far the slower half, so it
  # runs apart from the conformance gates (`npm run lint:gates-full`, every entry of
  # scripts/lib/gate-registry.mjs) rather than in front of them.
  lint-eslint:
    name: lint (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      # Restore the generated i18n output BEFORE install: `npm ci` runs `prepare`, which
      # compiles it (via the stamped script), so a hit turns that into a skip.
      - uses: ./.github/actions/i18n-cache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run gen-version
      - run: npm run i18n:compile:cached
      # Same shape as the i18n cache (.github/actions/i18n-cache), and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      # ESLint's own cache, persisted between runs. Measured on this repo: a cold
      # eslint is 442s, and a warm one with a single file touched is 6s — the
      # type-aware program is built lazily for the files actually linted, so a
      # cache hit skips that too. CI was paying the cold price every run.
      #
      # The classic reason this does not work on GitHub Actions is that a fresh
      # checkout gives every file a new mtime, and ESLint's DEFAULT cache
      # strategy is metadata — so the cache misses on all files. `lint:eslint`
      # already passes `--cache-strategy content`, which hashes contents instead;
      # that flag is what makes persisting this worthwhile at all. Do not remove
      # it without removing this cache.
      #
      # Keyed on the config and the lockfile, so a rule change or a plugin bump
      # starts a fresh cache rather than silently reusing verdicts computed under
      # the old rules. The restore-keys prefix CONTAINS that same hash, so a
      # fallback can only ever come from a run with identical rules — it cannot
      # under-invalidate. The commit sha suffix keeps a fresh copy saved each run
      # instead of freezing at the first one.
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
      - run: npm run lint:eslint

  lint-gates:
    name: lint (gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      # Restore the generated i18n output BEFORE install: `npm ci` runs `prepare`, which
      # compiles it (via the stamped script), so a hit turns that into a skip.
      - uses: ./.github/actions/i18n-cache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run gen-version
      - run: npm run i18n:compile:cached
      # knip resolves every `./+types/*` import a route file makes, so it needs
      # the generated route types present or it reports the whole of app/routes
      # as unresolved. In the old serial job these existed only because
      # type-check had already run; nothing declared the dependency.
      # Same shape as the i18n cache (.github/actions/i18n-cache), and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run lint:gates-full
      - name: Migration drift gate (schema vs migrations)
        run: npm run db:check
      # The native app is a shipped binary that cannot be recalled, so a breaking
      # change to the endpoints it calls must fail the pull request. oasdiff
      # compares the committed contract against the base branch's copy.
      # `breaking --fail-on ERR` exits non-zero on any ERR-level change (a removed
      # operation, a removed required response property, a new required request
      # property, ...). Image pinned to a release at least two weeks old AND to its
      # manifest digest, so a retagged image cannot change what runs here.
      - name: Native contract - no breaking changes against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          BASE_FILE="contracts/native-contract.openapi.json"
          # A base branch that cannot be resolved is an error, never a reason to skip.
          # So is a base branch without the contract file: the contract is on every
          # base branch this workflow runs against, so `git show` failing here fails
          # the step instead of quietly comparing nothing.
          git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" > /dev/null
          mkdir -p "$RUNNER_TEMP/native-base"
          git show "origin/${BASE_REF}:${BASE_FILE}" > "$RUNNER_TEMP/native-base/native-contract.openapi.json"
          docker run --rm \
            -v "$RUNNER_TEMP/native-base:/base:ro" -v "$PWD/contracts:/head:ro" \
            tufin/oasdiff:v1.32.1@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac \
            breaking /base/native-contract.openapi.json /head/native-contract.openapi.json --fail-on ERR

      # The list of response keys the contract does not document yet may only
      # shrink. Keys are counted, not entries, because a key can be added inside
      # an existing entry. Both numbers are always printed. A base branch that has
      # no list yet is the one case that is skipped, and it says so: it is the pull
      # request that introduces the file.
      - name: Native response allow-list - may only shrink against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          F="tests/unit/helpers/undeclared-response-keys.allowlist.json"
          git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" > /dev/null
          count() { node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(a.reduce((n,e)=>n+e.keys.length,0))'; }
          HEAD_N=$(count < "$F")
          if ! git cat-file -e "origin/${BASE_REF}:${F}" 2>/dev/null; then
            echo "allow-list keys: base=none head=${HEAD_N} (the base branch has no list yet; nothing to compare)"
            exit 0
          fi
          BASE_N=$(git show "origin/${BASE_REF}:${F}" | count)
          echo "allow-list keys: base=${BASE_N} head=${HEAD_N}"
          if [ "$HEAD_N" -gt "$BASE_N" ]; then
            echo "The allow-list grew (${BASE_N} -> ${HEAD_N}); document the field in the contract instead."
            exit 1
          fi

  # ── Tests ────────────────────────────────────────────────────────────────
  # Sharded across four runners. This job was the longest in the workflow at
  # 7m22s, and the suite is import-bound rather than assertion-bound: `import`
  # dominates `tests` because every spec file (well over a thousand now) rebuilds
  # the module graph in its own process, except the ones listed as shareable.
  #
  # Sharding buys the wall-clock back WITHOUT touching a single test: each shard
  # is a run of a subset of the files, with no new failure mode of its own.
  #
  # Relaxing vitest's per-file isolation for the WHOLE suite was investigated and
  # rejected: hundreds of specs mock `drizzle-orm/d1` at module scope and share
  # one `vi.fn()` once the registry is shared. Isolation is therefore relaxed only
  # for the specs listed in tests/unit/isolation.json (vitest project
  # `api-shared`), which `npm run lint:unit-isolation` keeps free of mocks, global
  # writes and stateful modules; every other spec stays in `api-isolated`. The
  # shuffled second step below is the dynamic check on that list.
  #
  # `fail-fast: false` so one red shard does not hide the others' results.
  test-unit:
    name: API unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      # Restore the generated i18n output BEFORE install: `npm ci` runs `prepare`, which
      # compiles it (via the stamped script), so a hit turns that into a skip.
      - uses: ./.github/actions/i18n-cache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run gen-version
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/4
      # The specs listed as shareable in tests/unit/isolation.json run with
      # `isolate: false` in the step above, in whatever order the shard hands them
      # out. Run just that project again with files and tests shuffled: a spec that
      # only passes because of what ran before it in the same worker fails here
      # instead of weeks later in an unrelated pull request. The seed is printed at the
      # START of the run. Replay locally with: npx vitest run --config
      # vitest.api.config.ts --project api-shared --sequence.shuffle
      # --sequence.seed=<seed> --maxWorkers=1 (plus the same --shard). One worker is
      # the faithful replay: with isolate false, which files share a worker depends on
      # scheduling. Shuffle also reorders tests inside a file, so a failure may be an
      # order-dependent test within one file rather than a sharing leak. The shard
      # flag is the same, but it is applied to the shared project alone, so a file may
      # land on a different shard number here than in the step above; the four shards
      # together still cover every shared file exactly once.
      - run: npm run test:unit:shared-shuffled -- --shard=${{ matrix.shard }}/4

  # Our outbound payloads against Intuit's own vendored schemas. No network, no
  # credentials, ~0.3s — so it is its own job rather than a tail on another,
  # and it reports separately: "the QuickBooks contract broke" and "a unit test
  # broke" are different problems with different fixes.
  #
  # This is only the OFFLINE half. The live half (tests/contract/qbo/*.live.spec.ts)
  # needs sandbox credentials CI does not have and runs from pre-push instead —
  # see docs/develop/testing.md.
  test-contract:
    name: contract tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run test:contract

  test-workers:
    name: worker-runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      # Restore the generated i18n output BEFORE install: `npm ci` runs `prepare`, which
      # compiles it (via the stamped script), so a hit turns that into a skip.
      - uses: ./.github/actions/i18n-cache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run gen-version
      - run: npm run test:workers

  # Sharded like the api suite, and for the same reason: import-bound, so a
  # subset costs far less than its share of the whole. Measured locally,
  # `--shard=1/4` is 84 files / 586 tests in 55s against 159-181s for all 335.
  #
  # ⚠️ The trade, stated rather than buried: `transform` (40s) and `setup` (26s)
  # are per-shard fixed costs, so four shards spend roughly 40% MORE total CPU to
  # take ~65% off the wall clock. That is the right trade for a CI gate people
  # wait on, and the wrong one if these minutes are ever billed by the second.
  test-web:
    name: web unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      # Restore the generated i18n output BEFORE install: `npm ci` runs `prepare`, which
      # compiles it (via the stamped script), so a hit turns that into a skip.
      - uses: ./.github/actions/i18n-cache
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run gen-version
      - run: npm run i18n:compile:cached
      # Same shape as the i18n cache (.github/actions/i18n-cache), and for the same reason: the
      # output is a pure function of the route TREE, so a key built from those
      # inputs can only restore what they produced. Five jobs need these types
      # and every one of them was paying the full ~60s generate — five runner
      # minutes per CI run for identical output. Hashing the route file bodies
      # over-invalidates (editing a loader cannot change the generated types)
      # but never under-invalidates, which is the safe direction for a cache.
      - uses: actions/cache@v4
        with:
          path: .react-router/types
          key: rr-typegen-${{ hashFiles('app/routes.ts', 'app/routes/**', 'react-router.config.ts', 'package-lock.json') }}
      - run: npx react-router typegen
      - run: npm run test:web -- --shard=${{ matrix.shard }}/4
      # The specs listed in tests/web-isolation.json run with `isolate: false` in the step above (projects
      # web-node-shared and web-dom-shared), in whatever order the shard hands them out. Run just those two
      # projects again with files and tests shuffled: a spec that only passes because of what ran before it
      # in the same worker, or that leaves a mount behind in the shared window, fails here instead of weeks
      # later in an unrelated pull request. The seed is printed at the START of the run. Replay locally with:
      # npx vitest run --config vitest.config.ts --project web-node-shared --project web-dom-shared
      # --sequence.shuffle --sequence.seed=<seed> --maxWorkers=1 (plus the same --shard). The shard flag applies
      # to the two shared projects alone, so a file may land on a different shard number than in the step above;
      # the four shards together still cover every shared file exactly once.
      - run: npm run test:web:shared-shuffled -- --shard=${{ matrix.shard }}/4

  # ── Build + bundle ceiling ───────────────────────────────────────────────
  build:
    name: build + bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No i18n-cache action here or in e2e: the vite paraglide plugin can delete the in-output stamp before a cache would be saved.
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.x, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run gen-version
      - run: npm run build
      # Bundle-size gate (Workers Free 3 MiB gzipped). Reuses the build/ output
      # from the previous step (--skip-build); also enforced in pre-commit.
      - run: npm run check:bundle -- --skip-build
      # The npm package of @inspectorhub/field-ui, checked on the pull request instead of on
      # release day: build, stage, scan the staged directory, dry-run the pack, and check that the
      # release manifest and package.json agree. Generic scan rules only: no --require-extra here,
      # because the run-time patterns come from a repository secret and secrets are absent on
      # pull requests from forks. The publish workflow runs the same script WITH --require-extra.
      - run: npm run release:check:field-ui
      # The same check for @inspectorhub/offline-package, which also compares the built
      # declaration file against the committed export list (packages/offline-package/api-surface.json).
      - run: npm run release:check:offline-package

  # ── The required check ───────────────────────────────────────────────────
  # Does no work; exists so branch protection has a single stable name to
  # require. `if: always()` plus the explicit result test is load-bearing: with
  # the default `success()` behaviour a SKIPPED dependency would let this pass,
  # so a cancelled or skipped job would read as green.
  verify:
    name: verify
    runs-on: ubuntu-latest
    if: always()
    needs:
      - typecheck-app
      - lint-eslint
      - lint-gates
      - test-unit
      - test-contract
      - test-workers
      - test-web
      - build
      # e2e was NOT in this list, so a red E2E run left `verify` green. Since
      # verify is the job branch protection keys off, that made the whole E2E
      # suite advisory without anyone deciding it should be — a gate that runs,
      # reports, and cannot block. It costs verify the wait for e2e (~5 min,
      # and it is the longest job), which is the price of it meaning what its
      # name says.
      - e2e
    steps:
      # Block scalar, not a plain one: a plain YAML scalar may not contain
      # ": " and `echo "results: …"` does, which is a parse error rather than
      # the harmless-looking line it resembles.
      - name: Report results
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
      # An EXPRESSION, not shell. GitHub expressions accept only single-quoted
      # strings; a stray double quote fails the entire WORKFLOW to parse, and
      # the run then shows zero jobs and "this run likely failed because of a
      # workflow file issue" — which looks nothing like a syntax error. Local
      # `yaml.safe_load` does not catch it either: that validates YAML, not
      # Actions expressions. This is how the first version of this file broke.
      - name: Fail if any check did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more checks did not succeed."
          exit 1

  # Seeded Playwright E2E against the real built worker. Independent of the
  # fan-out above. playwright.config.ts's `webServer` builds the worker and boots
  # `wrangler dev` on :8789; `globalSetup` truncates + migrates + seeds local D1
  # so every spec exercises the actual database. Auth is standalone-mode only
  # (the local login form) — saas login is a portal handoff and is out of scope
  # for this repo's CI.
  # Two runners, one per Playwright config. They were two steps on one runner:
  # 72s of shared setup, then 166s and 112s back to back = 357s.
  #
  # Measured breakdown of the first step before splitting: 38s build + boot,
  # 21s globalSetup seed, 104s actually running 205 tests. The second step ran
  # 9 tests in 10s behind ~102s of its own globalSetup.
  #
  # ⚠️ The honest cost: the second config currently REUSES the first's running
  # worker (`reuseExistingServer`), so on its own runner it must now build and
  # boot one itself — about 38s it did not previously pay, on top of a second
  # `npm ci` and browser install. Wall clock ~238s against 357s; total runner
  # time goes UP. That is the trade, and it is the right way round for a gate
  # people wait on.
  #
  # NOT sharded further. Playwright re-runs a project's `dependencies` in EVERY
  # shard (microsoft/playwright#21974), and `playwright.config.ts` records that
  # every project shares one wrangler-dev worker and one D1 seeded once — three
  # separate causes had to be fixed to get from 1 worker to 3, the third found
  # only because a run failed. Separate runners sidestep that ceiling; more
  # shards would multiply the setup that is already most of the second leg.
  e2e:
    name: e2e (${{ matrix.suite.label }})
    # Pinned: `ubuntu-latest` now resolves to 26.04, which Playwright 1.60 cannot install Chromium on; unpin when Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { id: seeded-d1, label: 'seeded D1', script: 'test:e2e' }
          - { id: multi-user, label: 'multi-user seed', script: 'test:e2e:seeded' }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # build (via webServer) imports server/generated/version.ts.
      - name: Generate version stamp
        run: npm run gen-version

      # Provision a throwaway .dev.vars (ES256 keypair + JWT_SECRET + SETUP_CODE)
      # that `wrangler dev` reads at boot. Without it the worker has no JWT keys
      # and /api/auth/setup fails. Idempotent; all values freshly generated.
      - name: Provision ephemeral E2E secrets
        run: node scripts/gen-e2e-dev-vars.mjs

      # Keyed on the resolved Playwright version, because the browser build a
      # given Playwright pins is a pure function of it — a hit can only ever
      # restore the binary that version asked for. `--with-deps` still runs on a
      # hit; it installs system libraries into /usr, which is outside the cached
      # path and cheap once the download is skipped.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # The two configs cannot share one D1: the multi-user seed writes users
      # into the standalone tenant, which 409s the other run's fresh-setup
      # assertion. See playwright.seeded.config.ts for the full reasoning. That
      # is why they are two runners rather than one run — each gets its own
      # worker and its own D1 by construction.
      - name: E2E tests
        run: npm run ${{ matrix.suite.script }}

      # ⚠️ Per-leg artifact name. upload-artifact@v4 FAILS on a duplicate name
      # rather than merging, so a matrix that uploads must key the name on the
      # matrix value — otherwise the second leg's failure upload kills the job
      # that was already failing, and the report you wanted is the thing you lose.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite.id }}
          path: playwright-report/
          retention-days: 7
