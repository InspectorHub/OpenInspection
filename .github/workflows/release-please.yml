name: release-please

# Automated versioning for self-hosters: release-please reads the Conventional
# Commits landed on `main`, maintains a Release PR that bumps the version and
# updates CHANGELOG.md, and on merge tags `vX.Y.Z` + cuts a GitHub Release.
# See docs/operate/upgrade.md and the Versioning & Deprecation Policy in
# CONTRIBUTING.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Dispatches publish-field-ui.yml and publish-offline-package.yml (see the last steps).
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The token lives in this environment, which only the main branch may use, so a workflow on any other
    # branch cannot read it.
    environment: release
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A Release PR opened by the default GITHUB_TOKEN does not re-trigger
          # other workflows (e.g. CI), so its checks stay empty. To run CI on the
          # Release PR, provide a PAT or GitHub App token as RELEASE_PLEASE_TOKEN
          # and set it as the secret RELEASE_PLEASE_TOKEN of the `release` environment (restricted to main).
          # Without it the step below falls back to the default token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # Publishing is started only by this dispatch, which keeps the workflow filename that npm trusted
      # publishing is bound to and a single entry point. Do not make publish-field-ui.yml listen for the
      # tag: with RELEASE_PLEASE_TOKEN set, release-please's tags and releases do trigger workflows, so a
      # tag listener would publish twice. A workflow_dispatch started with GITHUB_TOKEN is exempt from the
      # rule that GITHUB_TOKEN events trigger nothing. The ref is the tag release-please made.
      - name: Publish @inspectorhub/field-ui
        if: >-
          github.repository == 'InspectorHub/OpenInspection' &&
          steps.release.outputs['packages/field-ui--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs['packages/field-ui--tag_name'] }}
        run: gh workflow run publish-field-ui.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

      # The same dispatch for @inspectorhub/offline-package; its workflow file name is bound to
      # its own trusted-publisher entry.
      - name: Publish @inspectorhub/offline-package
        if: >-
          github.repository == 'InspectorHub/OpenInspection' &&
          steps.release.outputs['packages/offline-package--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs['packages/offline-package--tag_name'] }}
        run: gh workflow run publish-offline-package.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
